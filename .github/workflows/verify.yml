name: Verify frozen R analysis
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - run: Rscript scripts/setup.R
      - run: Rscript scripts/analyze.R
      - run: Rscript scripts/verify.R
      - run: Rscript scripts/build_report.R
